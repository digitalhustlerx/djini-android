name: CI

# 只做 CI：单元测试、Android 打包、CLI 契约和网关集成。发布（CD）仍是手工流程。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 推新提交时取消上一次还没跑完的，main 上的推送各自跑完。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set Gradle JVM args for large Kotlin project
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC" >> gradle.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: |
            core/build/test-results/test
            core/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: cli (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set Gradle JVM args
        run: echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic
      # djiniCliTest first, then standalone Python tool tests
      - name: CLI tests
        run: ./gradlew :core:cliTest -PdjiniPython=python3 --stacktrace
      - name: Translation tool tests
        run: python3 -m unittest discover -s tools/i18n -v
      - name: Translation resource checks
        run: python3 tools/i18n/translations.py check
      - name: Log export tool tests
        run: python3 -m unittest discover -s tools -p 'test_pull_logs.py' -v
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-results
          path: |
            core/build/test-results/cliContractTest
            core/build/reports/tests/cliContractTest
          retention-days: 7
          if-no-files-found: ignore

  app:
    name: app (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set Gradle JVM args
        run: echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic
      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

  relay:
    name: relay (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set Gradle JVM args
        run: echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/relay/go.mod
          cache: true
          cache-dependency-path: tools/relay/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Relay integration test
        run: ./gradlew :core:relayTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relay-test-results
          path: |
            core/build/test-results/relayTest
            core/build/reports/tests/relayTest
          retention-days: 7
          if-no-files-found: ignore
