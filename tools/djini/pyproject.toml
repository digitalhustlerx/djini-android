[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "djini-phone-cli"
version = "0.1.0"
description = "Command-line client for Djini's Android task API"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
djini = "djini_cli:main"

[tool.setuptools]
py-modules = ["djini_cli", "djini_notifications"]
packages = ["djini_desk"]
package-dir = {"" = "scripts"}

[tool.setuptools.package-data]
djini_desk = ["*.html", "*.css", "*.js", "djini-logo.png"]
